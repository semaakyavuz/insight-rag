name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: insight_ci
  POSTGRES_PASSWORD: insight_ci_password
  POSTGRES_DB: insight_rag_ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  # No real LLM calls happen in the test suite (generate_answer/get_client
  # are always mocked), so a placeholder is enough here. If a test ever
  # needs a real Groq call, wire GROQ_API_KEY through a GitHub secret
  # (repo Settings -> Secrets and variables -> Actions) instead:
  # GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEY: dummy-ci-key

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: insight_ci
          POSTGRES_PASSWORD: insight_ci_password
          POSTGRES_DB: insight_rag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
